
<footer class="footer-section">
    <div class="container">

      <div class="footer-grid py-5">

        <!-- Brand -->
        <div class="footer-brand">
          <div class="d-flex align-items-center gap-2 mb-3">
            <img src="logo.png" alt="" class="brand-logo" width="36" height="36">
            <span class="brand-name">Errands<span class="brand-accent">&</span>Chores</span>
          </div>
          <p class="brand-desc">
            The simplest way to organize your daily tasks,
            household chores, and personal errands.
          </p>
          <button type="button" class="play-badge mt-3" (click)="onOpenApp()">
            <i class="bi bi-box-arrow-up-right"></i>
            <div class="badge-text">
              <span class="badge-sub">Get the</span>
              <span class="badge-main">App</span>
            </div>
          </button>
        </div>

        <!-- Links rápidos -->
        <div class="footer-links">
          <h6 class="footer-heading">Quick Links</h6>
          <ul class="list-unstyled">
            @for (link of links; track link.section) {
              <li>
                <a (click)="scrollTo(link.section)">{{ link.label }}</a>
              </li>
            }
          </ul>
        </div>


      </div>

      <!-- Bottom bar -->
      <div class="footer-bottom d-flex flex-column flex-sm-row justify-content-between align-items-center py-3 gap-2">
        <span>© {{ year }} Errands & Chores. All rights reserved.</span>
      
      </div>

    </div>
  </footer>
