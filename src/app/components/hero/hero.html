<!-- src/app/components/hero/hero.component.html -->

<section class="hero-section d-flex align-items-center" id="hero">
    <div class="container">
      <div class="row align-items-center gy-5">

        <!-- Texto -->
        <div class="col-lg-6 text-center text-lg-start" data-aos="fade-right">
          <span class="badge-pill mb-3 hero-badge">
            <i class="bi bi-stars me-1"></i> Free · English &amp; Español
          </span>
          <h1 class="hero-title">
            Stay on top of every<br>
            <span class="highlight">errand & chore</span>
          </h1>
          <p class="hero-sub mt-3 mb-4">
            The simplest way to organize your daily tasks, household chores,
            and personal errands — all in one beautiful app.
          </p>

          <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center justify-content-lg-start">
            <button type="button" class="btn btn-primary-custom btn-lg d-flex align-items-center gap-2 hero-cta" (click)="onOpenApp()">
              <i class="bi bi-box-arrow-up-right"></i>
              Get the app
            </button>
          </div>

          <!-- Stats -->
          <div class="hero-stats d-flex gap-4 mt-5 justify-content-center justify-content-lg-start">
            <div class="stat">
              <span class="stat-number" data-target="5">5</span>
              <span class="stat-label">Themes</span>
            </div>
            <div class="stat">
              <span class="stat-number" data-target="3">3</span>
              <span class="stat-label">Platforms</span>
            </div>
            <div class="stat">
              <span class="stat-number" data-target="2">2</span>
              <span class="stat-label">Languages</span>
            </div>
          </div>
        </div>

        <!-- Capturas reales: tema claro delante, oscuro detrás -->
        <div class="col-lg-6 d-flex justify-content-center" data-aos="fade-left" data-aos-delay="150">
          <div class="hero-devices hero-phone-mockup">
            <div class="device device-back" aria-hidden="true">
              <div class="device-screen">
                <img src="screens/dark.webp" alt="" width="390" height="844" loading="eager" decoding="async">
              </div>
            </div>
            <div class="device device-front">
              <div class="device-screen">
                <img src="screens/tasks.webp" alt="Errands & Chores home screen with today's tasks" width="390" height="844" loading="eager" decoding="async">
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>
