<!-- src/app/components/app-preview/app-preview.component.html -->

<section class="preview-section py-5" id="preview">
  <div class="container">

    <!-- Header -->
    <div class="text-center mb-5" data-aos="fade-up">
      <span class="section-badge-light">App Preview</span>
      <h2 class="section-title text-white mt-2">See it in action</h2>
      <p class="section-subtitle text-white-50 mt-3">
        Real screens from the app. Pick one to take a look.
      </p>
    </div>

    <div class="preview-layout" data-aos="fade-up" data-aos-delay="100">

      <!-- Pestañas -->
      <div class="preview-tabs" role="tablist" aria-label="App screens">
        @for (s of screens; track s.id; let i = $index) {
          <button
            type="button"
            role="tab"
            class="tab-btn"
            [class.active]="active === i"
            [attr.aria-selected]="active === i"
            (click)="setActive(i)">
            <i class="bi" [ngClass]="s.icon"></i>
            <span class="tab-text">
              <span class="tab-label">{{ s.label }}</span>
              <span class="tab-desc">{{ s.description }}</span>
            </span>
          </button>
        }
      </div>

      <!-- Dispositivo: todas las capturas cargadas, se cambia con un fundido -->
      <div class="phone-wrapper">
        <div class="device phone-frame">
          <div class="device-screen">
            @for (s of screens; track s.id; let i = $index) {
              <img
                [src]="s.image"
                [alt]="s.alt"
                [class.visible]="active === i"
                [attr.aria-hidden]="active !== i"
                width="390" height="844"
                loading="lazy" decoding="async">
            }
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
