<!-- src/app/components/cta/cta.component.html -->

<section class="cta-section py-5" id="cta">
    <div class="container">
      <div class="cta-card text-center" data-aos="zoom-in">
  
        <!-- Icono -->
        <div class="cta-icon mb-4">
          <i class="bi bi-check2-circle"></i>
        </div>
  
        <h2 class="cta-title">Ready to get organized?</h2>
        <p class="cta-subtitle mt-3 mb-4">
          Put your tasks, reminders and chores in one place
          and stay on top of everything that matters.
        </p>
  
  
        <!-- Botón -->
        <button
          type="button"
          class="btn btn-light btn-lg d-inline-flex align-items-center gap-2 px-5"
          (click)="onDownload()">
          <i class="bi bi-download"></i>
          Get the app
        </button>
  
        <!-- Badges info -->
        <div class="cta-badges d-flex justify-content-center gap-4 mt-4">
          <div class="cta-badge">
            <i class="bi bi-gift-fill"></i>
            <span>Free</span>
          </div>
          <div class="cta-badge">
            <i class="bi bi-fingerprint"></i>
            <span>Biometric lock</span>
          </div>
          <div class="cta-badge">
            <i class="bi bi-slash-circle"></i>
            <span>No ads</span>
          </div>
        </div>
  
      </div>
    </div>
  </section>
