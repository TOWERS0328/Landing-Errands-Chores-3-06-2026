<!-- src/app/components/cta/cta.component.html -->

<section class="cta-section py-5" id="cta">
    <div class="container">
      <div class="cta-card text-center" data-aos="zoom-in">
  
        <!-- Icono -->
        <div class="cta-icon mb-4">
          <i class="bi bi-check2-circle"></i>
        </div>
  
        <h2 class="cta-title">Ready to get organized?</h2>
        <p class="cta-subtitle mt-3 mb-4">
          Join 50,000+ people who use Errands & Chores every day
          to stay on top of everything that matters.
        </p>
  
        <!-- Rating -->
        <div class="cta-rating mb-4">
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-half"></i>
          <span class="ms-2">4.8 · 2,400+ reviews</span>
        </div>
  
        <!-- Botón -->
        <button
          class="btn btn-light btn-lg d-inline-flex align-items-center gap-2 px-5"
          (click)="onDownload()">
          <i class="bi bi-android2"></i>
          Download for Android
        </button>
  
        <!-- Badges info -->
        <div class="cta-badges d-flex justify-content-center gap-4 mt-4">
          <div class="cta-badge">
            <i class="bi bi-shield-check-fill"></i>
            <span>Free to download</span>
          </div>
          <div class="cta-badge">
            <i class="bi bi-phone-fill"></i>
            <span>Android 8.0+</span>
          </div>
          <div class="cta-badge">
            <i class="bi bi-lock-fill"></i>
            <span>No ads on Premium</span>
          </div>
        </div>
  
      </div>
    </div>
  </section>
